<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akvarium</title>
  <!-- Forside lavet af Ditte -->
  <link rel="stylesheet" href="index.css">
  </head>
<body>


  
<div class="forside">
  <div id="ocean"></div>
</div>



<!-- TEKST 'AKVARIUM' START -->
<svg viewBox="0 0 1200 800"
     width="100%"
     height="auto"
     xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:0 auto; position:absolute; top:0; left:0; right:0; pointer-events: none;">

  <!-- Hævet bue rykket lidt længere ned -->
  <path id="curve"
        d="M 200 470 A 400 300 0 0 1 1000 470"
        fill="transparent" />

  <!-- Farvegradient og skygge -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD94D"/>
      <stop offset="50%" stop-color="#FFA200"/>
      <stop offset="100%" stop-color="#FF7B00"/>
    </linearGradient>

    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="3" flood-color="#843000" flood-opacity="1"/>
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- Tekst -->
  <text font-family="'Baloo 2', sans-serif"
        font-size="140"
        font-weight="900"
        fill="url(#grad)"
        stroke="#b45a00"
        stroke-width="6"
        paint-order="stroke fill"
        text-anchor="middle"
        filter="url(#textShadow)">
    <textPath href="#curve" startOffset="50%">
      AKVARIUM
    </textPath>
  </text>
</svg> 
<!-- TEKST 'AKVARIUM' SLUT -->


<!-- KNAPPER -->
 
  <div class="buttons">
    <button class="btn info" title="Info">i</button>
    <button class="btn play" title="Spil">&#9658;</button>
  </div>

  <!-- INDSTILLINGER KNAP -->
       <button class="btn settings-btn" title="Indstillinger">⚙️</button>


  <!-- Dykker GIF (Lavet af Mia) -->
  <img class="dykker" src="image/dykker.png" alt="Dykker" />

   
    <script src="index.js">
  </script>
  </script>
</body>
</html>
